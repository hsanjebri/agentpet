appId: com.agentpet.app
productName: AgentPet
copyright: AgentPet contributors
directories:
  buildResources: build
  output: dist
files:
  - '!**/.vscode/*'
  - '!{src,tests,scripts,recordings,docs,helper,site,promo,supabase}/**'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!vitest.config.*'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,.editorconfig,.gitattributes,dev-app-update.yml,CHANGELOG.md,README.md,AGENTPET_PLAN.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
win:
  executableName: AgentPet
  target: nsis
  # the music helper (Windows media session API), built by npm run helper:build
  extraResources:
    - from: helper/nowplaying/dist
      to: nowplaying
      filter:
        - nowplaying.exe
# Microsoft Store package: built by scripts/build-store.mjs (npm run build:store or the
# "Store package" workflow), which adds the identity from Partner Center (environment variables).
appx:
  applicationId: AgentPet
  backgroundColor: '#FFF6E9'
  languages:
    - en-US
  artifactName: ${productName}-Store.${ext}
nsis:
  # no version in the names: the website can always link to releases/latest/download/…
  artifactName: ${productName}-Setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: false
  oneClick: true
mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [arm64, x64] # Apple silicon + Intel
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    LSUIElement: true # tray app: no Dock icon
  notarize: false
dmg:
  artifactName: ${productName}-${arch}.${ext}
linux:
  target: AppImage
  maintainer: AgentPet contributors
  category: Development
appImage:
  artifactName: ${productName}.${ext}
npmRebuild: false
# auto-update: electron-updater reads latest.yml from the GitHub release
publish:
  provider: github
  owner: hsanjebri
  repo: agentpet
  releaseType: release
