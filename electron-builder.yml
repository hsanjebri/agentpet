appId: com.agentpet.app
productName: AgentPet
copyright: AgentPet contributors
directories:
  buildResources: build
  output: dist
files:
  - '!**/.vscode/*'
  - '!{src,tests,scripts,cli,recordings,docs}/**'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!vitest.config.*'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,.editorconfig,.gitattributes,dev-app-update.yml,CHANGELOG.md,README.md,AGENTPET_PLAN.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
# the hook script runs in the user's own Node, outside the app, so it ships as a plain file
extraResources:
  - from: cli
    to: cli
    filter:
      - '*.mjs'
win:
  executableName: AgentPet
  target: nsis
nsis:
  artifactName: ${productName}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: false
  oneClick: true
mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [arm64, x64] # Apple silicon + Intel
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    LSUIElement: true # tray app: no Dock icon
  notarize: false
dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}
linux:
  target: AppImage
  maintainer: AgentPet contributors
  category: Development
appImage:
  artifactName: ${productName}-${version}.${ext}
npmRebuild: false
